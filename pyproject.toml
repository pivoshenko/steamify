[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "steamify"
version = "2.1.0"
description = "A lightweight package with zero runtime dependencies for converting Markdown into Steam-compatible markup, and back again."
readme = "README.md"
keywords = [
  "bbcode",
  "converter",
  "formatter",
  "gaming",
  "markdown",
  "markup",
  "parser",
  "steam",
  "steam-bbcode",
  "steam-bbcode-converter",
  "steam-workshop",
  "steamify",
  "text-processing",
]
license = "MIT"
maintainers = [
  { name = "Volodymyr Pivoshenko", email = "contact@pivoshenko.dev" },
]
authors = [{ name = "Volodymyr Pivoshenko", email = "contact@pivoshenko.dev" }]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Other Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []
urls.Homepage = "https://github.com/pivoshenko/steamify"
urls.Repository = "https://github.com/pivoshenko/steamify"
scripts.steamify = "steamify.__main__:main"

[dependency-groups]
dev = ["ipdb~=0.13.13", "ipython~=9.18.1; python_version>='3.11'", "uv-upsync~=2.4.2"]
formatters = ["ruff~=0.17.4"]
linters = ["ruff~=0.17.4", "ty~=0.0.99"]
tests = [
  "coverage[toml]~=7.16.1",
  "pytest~=9.2.0",
  "pytest-cov~=7.1.0",
  "pytest-mock~=3.17.0",
  "pytest-sugar~=1.1.1",
]

[tool.ruff]
target-version = "py310"
line-length = 100
fix = true
unsafe-fixes = true
format.quote-style = "double"
format.docstring-code-format = true
lint.select = ["ALL"]
lint.ignore = ["COM812", "CPY001", "D101", "D102", "D103", "D107", "D203", "D213"]
lint.per-file-ignores."tests/**" = ["INP001", "PLR2004", "S101", "SLF001"]
lint.isort.force-single-line = true
lint.isort.from-first = false
lint.isort.length-sort-straight = true
lint.isort.lines-after-imports = 2
lint.isort.lines-between-types = 1
lint.isort.required-imports = ["from __future__ import annotations"]

[tool.ty]
environment.python-version = "3.10"

[tool.pytest]
ini_options.testpaths = ["tests"]
ini_options.addopts = ["--color=yes", "--cov=src", "--cov-report=term-missing"]

[tool.coverage]
run.omit = ["*/__init__.py"]
